# AI Next release: every push to the `ai-next` branch gets an automatic tag and a Docker
# image published to GitHub Container Registry (ghcr.io/<owner>/ai-next).
#
# Tag format: ai-next-vYYYY.MM.DD.<run_number> — it deliberately does NOT start with `v`, so
# the upstream `v*` tag pipelines (docker-publish.yml, electron-release.yml) never fire for it.
# Tags pushed with GITHUB_TOKEN do not trigger other workflows either; the image is built here.
name: AI Next release

on:
  push:
    branches: [ai-next]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# One release at a time; a newer push waits instead of cancelling a half-pushed image.
concurrency:
  group: ai-next-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute tag and image name
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="ai-next-v$(date -u +%Y.%m.%d).${RUN_NUMBER}"
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/ai-next"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag → $image"

      - name: Push tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — reusing it."
            exit 0
          fi
          git tag -a "$TAG" -m "AI Next release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  build:
    name: Build image (${{ matrix.arch }})
    needs: tag
    # Native runners per arch (no QEMU). Hosted runners have 16 GB, which the upstream
    # webpack image build is validated against with a 12288 MB heap.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          labels: |
            org.opencontainers.image.title=AI Next
            org.opencontainers.image.description=AI Next — AI gateway for multi-provider LLMs
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.tag.outputs.tag }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=
          outputs: type=image,name=${{ needs.tag.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ai-next-${{ matrix.arch }}
          cache-to: type=gha,scope=ai-next-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: [tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest (tag, latest, sha)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.tag.outputs.image }}
          TAG: ${{ needs.tag.outputs.tag }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-${SHORT_SHA::7}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE: ${{ needs.tag.outputs.image }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          {
            echo "### AI Next image published"
            echo ""
            echo "\`docker pull $IMAGE:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
